name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore umbrella-manager-local.sln
      - run: dotnet build umbrella-manager-local.sln -c Release --no-restore
      - run: dotnet test umbrella-manager-local.sln -c Release --no-build

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commit prüfen
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR-Titel ist kein Conventional Commit: $TITLE"
            exit 1
          fi
          if printf '%s\n' "$TITLE" | grep -Eq '\([gG][bB]_'; then
            echo "Scope darf nicht mit gb_ beginnen: $TITLE"
            exit 1
          fi
          if printf '%s\n' "$TITLE" | grep -Eq '\[(ADD|FIX|IMP|REF|REM)\]'; then
            echo "Odoo-Tags sind nicht erlaubt: $TITLE"
            exit 1
          fi
